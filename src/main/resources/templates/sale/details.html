<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de Venta - Sistema Farmacéutico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/sales.css">
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">
            <i class="bi bi-hospital me-2"></i>Farmacia
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="/sales">
                        <i class="bi bi-cash-stack me-1"></i>Ventas
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/medicines">
                        <i class="bi bi-capsule me-1"></i>Medicinas
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/pharmacists">
                        <i class="bi bi-person-badge me-1"></i>Farmacéuticos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/customers">
                        <i class="bi bi-people me-1"></i>Clientes
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container py-5">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h4><i class="bi bi-receipt me-2"></i>Detalles de Venta</h4>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                            <tr>
                                <th>ID Detalle</th>
                                <th>Medicamento</th>
                                <th>Cantidad</th>
                                <th>Precio Unitario</th>
                                <th>Total</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${#lists.isEmpty(saleDetails)}">
                                <td colspan="5" class="text-center text-muted py-4">
                                    <i class="bi bi-inbox display-4"></i>
                                    <p class="mt-2">No hay detalles para esta venta</p>
                                </td>
                            </tr>
                            <tr th:each="detail : ${saleDetails}">
                                <td th:text="${detail.id}">ID</td>
                                <td th:text="${detail.medicine.name}">Medicamento</td>
                                <td th:text="${detail.quantity}">Cantidad</td>
                                <td th:text="'$' + ${#numbers.formatDecimal(detail.unitPrice, 1, 2)}">Precio</td>
                                <td th:text="'$' + ${#numbers.formatDecimal(detail.subTotal, 1, 2)}">Total</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="mt-3">
                        <button type="button" class="btn btn-primary" onclick="window.location.href='/sales'">
                            <i class="bi bi-arrow-left me-2"></i>Volver a Ventas
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
