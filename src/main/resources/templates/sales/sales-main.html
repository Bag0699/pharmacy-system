<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas - Sistema Farmacéutico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/sales.css">
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">
            <i class="bi bi-hospital me-2"></i>Farmacia
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="/sales">
                        <i class="bi bi-cash-stack me-1"></i>Ventas
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/medicines">
                        <i class="bi bi-capsule me-1"></i>Medicinas
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/pharmacists">
                        <i class="bi bi-person-badge me-1"></i>Farmacéuticos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/customers">
                        <i class="bi bi-people me-1"></i>Clientes
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container-fluid py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1 class="text-center mb-5 text-primary">Módulo de Ventas</h1>

            <div class="row g-4">
                <div class="col-md-6">
                    <div class="card h-100 shadow-lg sales-card" onclick="window.location.href='/sales/new'">
                        <div class="card-body d-flex flex-column justify-content-center align-items-center text-center">
                            <div class="icon-wrapper mb-3">
                                <i class="bi bi-plus-circle display-1"></i>
                            </div>
                            <h3 class="card-title">Nueva Venta</h3>
                            <p class="card-text">Registrar una nueva venta</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card h-100 shadow-lg sales-card" onclick="window.location.href='/sales/list'">
                        <div class="card-body d-flex flex-column justify-content-center align-items-center text-center">
                            <div class="icon-wrapper mb-3">
                                <i class="bi bi-list-ul display-1"></i>
                            </div>
                            <h3 class="card-title">Administrar Ventas</h3>
                            <p class="card-text">Ver y gestionar ventas existentes</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/sales.js"></script>
</body>
</html>
