<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Ventas - Sistema Farmacéutico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/sales.css">
</head>
<body th:fragment="body">
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">
            <i class="bi bi-hospital me-2"></i>Farmacia
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="/sales">
                        <i class="bi bi-cash-stack me-1"></i>Ventas
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/medicines">
                        <i class="bi bi-capsule me-1"></i>Medicinas
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/pharmacists">
                        <i class="bi bi-person-badge me-1"></i>Farmacéuticos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/customers">
                        <i class="bi bi-people me-1"></i>Clientes
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container py-5">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="text-primary">Administrar Ventas</h1>
                <a href="/sales/new" class="btn btn-success">
                    <i class="bi bi-plus-circle me-2"></i>Nueva Venta
                </a>
            </div>

            <!-- Search and Filters -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="searchInput" class="form-label">Buscar por cliente:</label>
                            <input type="text" class="form-control" id="searchInput" placeholder="Escriba para buscar...">
                        </div>
                        <div class="col-md-3">
                            <label for="dateFrom" class="form-label">Fecha desde:</label>
                            <input type="date" class="form-control" id="dateFrom">
                        </div>
                        <div class="col-md-3">
                            <label for="dateTo" class="form-label">Fecha hasta:</label>
                            <input type="date" class="form-control" id="dateTo">
                        </div>
                        <div class="col-md-1 d-flex align-items-end">
                            <button class="btn btn-outline-secondary w-100" onclick="clearFilters()" title="Limpiar filtros">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>
                        <div class="col-md-1 d-flex align-items-end">
                            <button class="btn btn-primary w-100" onclick="filterSales()">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sales Table -->
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="bi bi-list-ul me-2"></i>Lista de Ventas</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Cliente</th>
                                <th>Farmacéutico</th>
                                <th>Fecha</th>
                                <th>Total</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${#lists.isEmpty(sales)}">
                                <td colspan="6" class="text-center text-muted py-4">
                                    <i class="bi bi-inbox display-4"></i>
                                    <p class="mt-2">No hay ventas registradas</p>
                                </td>
                            </tr>
                            <tr th:each="sale : ${sales}">
                                <td th:text="${sale.id}">1</td>
                                <td th:text="${sale.customer.firstName + ' ' + sale.customer.lastName}">Juan Pérez</td>
                                <td th:text="${sale.pharmacist.firstName + ' ' + sale.pharmacist.lastName}">Dr. García</td>
                                <td th:text="${#strings.substring(sale.saleDate, 0, 10)}">2025-11-15</td>
                                <td th:text="'$' + ${#numbers.formatDecimal(sale.totalAmount, 1, 2)}">$150.50</td>
                                <td>
                                    <button class="btn btn-sm btn-info" th:onclick="'viewSaleDetails(' + ${sale.id} + ')'">
                                        <i class="bi bi-eye"></i> Ver Detalle
                                    </button>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Sale Details Modal -->
<div class="modal fade" id="saleDetailsModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-info text-white">
                <h5 class="modal-title"><i class="bi bi-receipt me-2"></i>Detalles de Venta</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="saleDetailsContent">
                    <!-- Sale details will be loaded here -->
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                <button type="button" class="btn btn-primary" onclick="printSaleDetails()">
                    <i class="bi bi-printer"></i> Imprimir
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/sales-list.js"></script>
</body>
</html>
