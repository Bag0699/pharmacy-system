<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Farmacéutico - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<div class="container-fluid vh-100 d-flex align-items-center justify-content-center">
    <div class="row g-4 w-100">
        <div class="col-md-6">
            <div class="card h-100 shadow-lg dashboard-card" onclick="window.location.href='/sales'">
                <div class="card-body d-flex flex-column justify-content-center align-items-center text-center">
                    <div class="icon-wrapper mb-3">
                        <i class="bi bi-cash-stack display-1"></i>
                    </div>
                    <h3 class="card-title">Ventas</h3>
                    <p class="card-text">Gestionar ventas y transacciones</p>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card h-100 shadow-lg dashboard-card" onclick="window.location.href='/pharmacists'">
                <div class="card-body d-flex flex-column justify-content-center align-items-center text-center">
                    <div class="icon-wrapper mb-3">
                        <i class="bi bi-person-badge display-1"></i>
                    </div>
                    <h3 class="card-title">Farmacéuticos</h3>
                    <p class="card-text">Administrar personal farmacéutico</p>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card h-100 shadow-lg dashboard-card" onclick="window.location.href='/medicines'">
                <div class="card-body d-flex flex-column justify-content-center align-items-center text-center">
                    <div class="icon-wrapper mb-3">
                        <i class="bi bi-capsule display-1"></i>
                    </div>
                    <h3 class="card-title">Medicinas</h3>
                    <p class="card-text">Control de inventario de medicamentos</p>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card h-100 shadow-lg dashboard-card" onclick="window.location.href='/customers'">
                <div class="card-body d-flex flex-column justify-content-center align-items-center text-center">
                    <div class="icon-wrapper mb-3">
                        <i class="bi bi-people display-1"></i>
                    </div>
                    <h3 class="card-title">Clientes</h3>
                    <p class="card-text">Gestión de clientes</p>
                </div>
            </div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
