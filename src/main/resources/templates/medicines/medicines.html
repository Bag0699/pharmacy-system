<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicinas - Sistema Farmacéutico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/medicines.css">
</head>
<body th:fragment="body">
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">
            <i class="bi bi-hospital me-2"></i>Farmacia
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/sales">
                        <i class="bi bi-cash-stack me-1"></i>Ventas
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/medicines">
                        <i class="bi bi-capsule me-1"></i>Medicinas
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/pharmacists">
                        <i class="bi bi-person-badge me-1"></i>Farmacéuticos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/customers">
                        <i class="bi bi-people me-1"></i>Clientes
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container py-5">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="text-primary">Gestión de Medicinas</h1>
                <div>
                    <button class="btn btn-success me-2" data-bs-toggle="modal" data-bs-target="#medicineModal" onclick="openAddModal()">
                        <i class="bi bi-plus-circle me-2"></i>Agregar Medicina
                    </button>
                    <button class="btn btn-warning me-2" onclick="openEditModal()">
                        <i class="bi bi-pencil me-2"></i>Editar
                    </button>
                    <button class="btn btn-danger" onclick="deleteMedicine()">
                        <i class="bi bi-trash me-2"></i>Eliminar
                    </button>
                </div>
            </div>

            <!-- Search and Filters -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="searchInput" class="form-label">Buscar medicina:</label>
                            <input type="text" class="form-control" id="searchInput" placeholder="Buscar por nombre...">
                        </div>
                        <div class="col-md-4">
                            <label for="expirationFilter" class="form-label">Filtrar por vencimiento:</label>
                            <select class="form-select" id="expirationFilter">
                                <option value="">Todos los medicamentos</option>
                                <option value="expired">Vencidos</option>
                                <option value="1month">Por vencer (1 mes)</option>
                                <option value="3months">Por vencer (1-3 meses)</option>
                                <option value="3plus">Vigentes (+3 meses)</option>
                            </select>
                        </div>
                        <div class="col-md-1 d-flex align-items-end">
                            <button class="btn btn-outline-secondary w-100" onclick="clearFilters()" title="Limpiar filtros">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>
                        <div class="col-md-1 d-flex align-items-end">
                            <button class="btn btn-primary w-100" onclick="filterMedicines()">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Medicines Table -->
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="bi bi-capsule me-2"></i>Lista de Medicinas</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead class="table-dark">
                            <tr>
                                <th>
                                    <input type="checkbox" id="selectAll" onchange="toggleSelectAll()">
                                </th>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Precio</th>
                                <th>Stock</th>

                                <th>Fecha Vencimiento</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="medicine : ${medicines}">
                                <td>
                                    <input type="checkbox" class="medicine-checkbox" th:value="${medicine.id}">
                                </td>
                                <td th:text="${medicine.id}">1</td>
                                <td th:text="${medicine.name}">Paracetamol</td>
                                <td th:text="'$' + ${#numbers.formatDecimal(medicine.price, 1, 2)}">$15.50</td>
                                <td th:text="${medicine.stock}">100</td>

                                <td th:text="${medicine.expirationDate}">31/12/2024</td>
                                <td>

                                    <button class="btn btn-sm btn-warning" th:onclick="'editMedicine(' + ${medicine.id} + ')'">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="btn btn-sm btn-danger" th:onclick="'deleteMedicineById(' + ${medicine.id} + ')'">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Medicine Modal -->
<div class="modal fade" id="medicineModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="modalTitle">
                    <i class="bi bi-capsule me-2"></i>Agregar Medicina
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="medicineForm">
                    <input type="hidden" id="medicineId">
                    <div class="mb-3">
                        <label for="name" class="form-label">Nombre:</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="price" class="form-label">Precio:</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" class="form-control" id="price" name="price" step="0.01" min="0" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="stock" class="form-label">Stock:</label>
                        <input type="number" class="form-control" id="stock" name="stock" min="0" required>
                    </div>
                    <div class="mb-3">
                        <label for="expirationDate" class="form-label">Fecha de Vencimiento:</label>
                        <input type="date" class="form-control" id="expirationDate" name="expirationDate" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="saveMedicine()">
                    <i class="bi bi-save me-2"></i>Guardar
                </button>
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/medicines.js"></script>
</body>
</html>
